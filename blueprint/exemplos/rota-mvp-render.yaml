  plano: rotacerta-p1           # §27 · Bússola
  addons:
    veiculo_extra: 2            # o caso do Fundador na §47: +2 carros sem trocar de plano
  moeda: BRL
  idioma: pt-BR
  comunidade: true              # opt-in exercido (§16)
stack:
  destino: render
  regiao: oregon
  tamanho: small
provedores:
